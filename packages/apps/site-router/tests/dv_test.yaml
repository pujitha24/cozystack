suite: site-router boot DataVolume

# T04/T11 — the boot disk is a CDI DataVolume. By default it clones the shared
# golden VyOS appliance image (cozy-public/vyos-router) provisioned by
# packages/system/vyos-router-image, so one registry import per cluster is shared
# by every gateway. An http source override (image.enabled + image.url) points the
# boot disk at an operator-hosted appliance disk instead. storageClass is pinned to
# `replicated` (DRBD/LINSTOR) so the boot disk is live-migratable.
#
# The template's golden guards (absent / phase Failed / StorageClass mismatch) are
# install-time guards built on lookup(), which returns nothing under
# `helm template` — so they are no-ops here by construction and cannot be asserted
# in this suite. What is asserted is the render shape they protect.

templates:
  - templates/dv.yaml

release:
  name: site-router-test
  namespace: tenant-test

set:
  _cluster: {}

tests:
  - it: renders a DataVolume named <release>-boot
    documentSelector:
      path: kind
      value: DataVolume
    asserts:
      - equal:
          path: metadata.name
          value: site-router-test-boot
      - equal:
          path: spec.contentType
          value: kubevirt

  # The golden's name and namespace are a contract with
  # packages/system/vyos-router-image/templates/dv.yaml. A drift on either side
  # makes every instance render fail its golden lookup, so pin both.
  - it: default source clones the golden VyOS appliance image in cozy-public
    documentSelector:
      path: kind
      value: DataVolume
    asserts:
      - equal:
          path: spec.source.pvc.name
          value: vyos-router
      - equal:
          path: spec.source.pvc.namespace
          value: cozy-public
      - notExists:
          path: spec.source.http

  - it: storageClass is pinned to replicated
    documentSelector:
      path: kind
      value: DataVolume
    asserts:
      - equal:
          path: spec.storage.storageClassName
          value: replicated

  # R1 — the request is 12Gi, not the 10Gi virtual size of the VyOS qcow2: CDI's
  # filesystem-import scratch (decompressed image + ~5.5% fs overhead) overflows a
  # request equal to the virtual size ("virtual image size larger than reported
  # available storage"), which fails the boot-disk import live on VyOS 1.5-rolling.
  # It must also stay >= the golden's storage, since a clone target can never be
  # smaller than its source.
  - it: requests 12Gi to fit the CDI filesystem-import scratch over the 10Gi image
    documentSelector:
      path: kind
      value: DataVolume
    asserts:
      - equal:
          path: spec.storage.resources.requests.storage
          value: 12Gi

  - it: http override sources the boot disk from image.url
    set:
      image:
        enabled: true
        url: https://images.example.test/vyos-1.5-rolling.qcow2
    documentSelector:
      path: kind
      value: DataVolume
    asserts:
      - equal:
          path: spec.source.http.url
          value: https://images.example.test/vyos-1.5-rolling.qcow2
      - notExists:
          path: spec.source.pvc
