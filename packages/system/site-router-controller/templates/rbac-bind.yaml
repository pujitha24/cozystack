apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apps.cozystack.io:site-router-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: apps.cozystack.io:site-router-controller
subjects:
- kind: ServiceAccount
  name: site-router-controller
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apps.cozystack.io:site-router-controller:golden-image
  namespace: cozy-public
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: apps.cozystack.io:site-router-controller:golden-image
subjects:
- kind: ServiceAccount
  name: site-router-controller
  namespace: {{ .Release.Namespace }}
