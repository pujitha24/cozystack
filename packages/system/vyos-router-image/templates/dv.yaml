{{- /*
  The shared golden VyOS appliance disk. Imported once into cozy-public and
  CDI-cloned by every SiteRouter boot disk (packages/apps/site-router/templates/
  dv.yaml), mirroring the Talos worker golden in
  packages/system/kubernetes-worker-image.

  The source is the digest-pinned OCI containerDisk this package builds; the
  `image` target stamps `<ref>@sha256:<digest>` into images/vyos-router-disk.tag
  and this reads it back. `required` on the trimmed contents means an unstamped
  or empty .tag fails the render loudly here — at the platform package that owns
  the image — instead of rendering a DataVolume that imports a reference which
  cannot resolve and leaves a gateway waiting on a PVC forever.
*/ -}}
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  annotations:
    {{- /*
      Keep the golden when this release is removed or its reference changes. It
      is a clone SOURCE: deleting it while a gateway's boot disk is mid-clone
      strands that clone, and CDI never re-imports into an already-populated PVC
      anyway, so an in-place ref change is not something Helm can apply. Replacing
      the appliance is therefore a deliberate delete once no gateway is cloning
      (see values.yaml, "Advancing the appliance").
    */}}
    helm.sh/resource-policy: keep
    {{- /*
      bind.immediate so the import starts now rather than waiting for a first
      consumer: this DataVolume going Ready is what the SiteRouter boot-disk
      clones wait on. usePopulator matches the vm-default-images convention.
    */}}
    cdi.kubevirt.io/storage.bind.immediate.requested: "true"
    cdi.kubevirt.io/storage.usePopulator: "true"
    vyos-router-image.cozystack.io/vyos-version: {{ .Values.vyosVersion | quote }}
  labels:
    app.kubernetes.io/managed-by: cozystack
  {{- /*
    Stable name the site-router app reconstructs to clone this golden — keep in
    sync with the goldenName literal in packages/apps/site-router/templates/dv.yaml.
  */}}
  name: vyos-router
  namespace: cozy-public
spec:
  contentType: kubevirt
  source:
    registry:
      url: {{ printf "docker://%s" (required "empty images/vyos-router-disk.tag: the VyOS appliance containerDisk has not been stamped by a build — run `make -C packages/system/vyos-router-image image`, or install a Cozystack build whose CI stamped it" (.Files.Get "images/vyos-router-disk.tag" | trim)) | quote }}
  storage:
    resources:
      requests:
        storage: {{ .Values.storage | quote }}
    {{- with .Values.storageClass }}
    storageClassName: {{ . | quote }}
    {{- end }}
