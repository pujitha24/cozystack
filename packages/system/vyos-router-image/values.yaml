##
## @section VyOS site-router appliance golden image
##
## Provisions the VyOS router appliance disk as a single golden DataVolume in the
## cozy-public namespace, so every SiteRouter gateway boots by CDI clone (a
## storage-layer copy) of one shared image instead of importing the appliance
## disk per instance. This mirrors the Talos worker golden in
## packages/system/kubernetes-worker-image.
##
## The image itself is built in-repo by THIS package's `image` target (see the
## Makefile and hack/build-qcow2.sh) and published as a digest-pinned OCI
## containerDisk; that build stamps the reference into
## images/vyos-router-disk.tag, which templates/dv.yaml reads via `.Files.Get`.
## The artifact ships as a registry image rather than an HTTP qcow2 precisely so
## it can be pinned by digest — CDI's http importer cannot verify a sha256.
##
## Unlike the Talos worker catalog this package is NOT opt-in: it is emitted
## alongside the site-router application and controller (see
## packages/core/platform/templates/bundles/naas.yaml). A tenant Kubernetes node
## group without `image.builtin` still boots by importing over HTTP, so a missing
## Talos golden only costs a slower path; a SiteRouter gateway has no equivalent
## fallback, so shipping the app without its golden would leave the default
## install unable to boot a gateway at all.
##
## Advancing the appliance: the disk and the site-router cloud-init contract
## advance atomically (packages/apps/site-router/docs/image-lifecycle.md), so a
## VYOS_VERSION bump is a deliberate operator action. The golden keeps a stable
## name, and CDI never re-imports into an already-populated PVC, so replacing the
## appliance means deleting the golden DataVolume once no gateway is mid-clone —
## existing gateways keep running on their own cloned disks and are reimaged only
## when their instance is recreated.

## @param {string} storageClass - StorageClass for the golden image. MUST match the StorageClass of the SiteRouter boot disks that clone it: CDI takes the storage-layer clone path only when source and target share a StorageClass, and across classes it silently falls back to a host-assisted copy over the pod network. The site-router boot disk pins `replicated` (DRBD/LINSTOR) so the gateway stays migratable, and the app's render rejects a mismatch outright.
storageClass: "replicated"

## @param {quantity} storage - Storage size allocated for the golden image. 12Gi, not the 10Gi virtual size of the VyOS qcow2: CDI's filesystem-import scratch needs the decompressed image plus ~5.5% filesystem overhead, so a request equal to the virtual size fails the import with "virtual image size larger than reported available storage" (validated live on VyOS 1.5-rolling). Must stay <= the smallest boot disk that clones it, since a clone target cannot be smaller than its source.
storage: "12Gi"

## @param {string} vyosVersion - VyOS version baked into the appliance, recorded as an annotation on the golden for provenance. Informational only — the disk contents are pinned by the digest in images/vyos-router-disk.tag. Keep in sync with VYOS_VERSION in this package's Makefile.
vyosVersion: "1.5-rolling-20260720"
