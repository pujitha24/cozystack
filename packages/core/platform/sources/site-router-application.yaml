---
apiVersion: cozystack.io/v1alpha1
kind: PackageSource
metadata:
  name: cozystack.site-router-application
spec:
  sourceRef:
    kind: OCIRepository
    name: cozystack-packages
    namespace: cozy-system
    path: /
  variants:
    - name: default
      dependsOn:
        # kube-ovn + Cilium: the router VM attaches to the tenant pod network.
        - cozystack.networking
        # KubeVirt runs the gateway VirtualMachine (templates/vm.yaml).
        - cozystack.kubevirt
        # CDI provisions the boot DataVolume (templates/dv.yaml).
        - cozystack.kubevirt-cdi
        # cozystack-engine ships the ApplicationDefinition CRD rendered by the *-rd component below.
        - cozystack.cozystack-engine
        # site-router-controller mediates kube-ovn routing/port-security and pushes
        # VyOS config; installed before SiteRouter instances so they reconcile.
        - cozystack.site-router-controller
        # vyos-router-image provides the cozy-public/vyos-router golden DataVolume
        # every SiteRouter boot disk clones (templates/dv.yaml), and the instance
        # render looks it up and fails loudly when it is absent — so it must exist
        # before any instance renders. Safe as a hard dependsOn because naas.yaml
        # emits it non-optionally under the same iaas.enabled gate that emits this
        # package, exactly like kubevirt / kubevirt-cdi above, so it always
        # resolves. (An earlier revision cloned from the opt-in vm-default-images
        # instead, where a hard dependsOn would have left this registration Package
        # stuck InProgress forever on any install that did not enable it.)
        - cozystack.vyos-router-image
      libraries:
        - name: cozy-lib
          path: library/cozy-lib
      components:
        - name: site-router
          path: apps/site-router
          libraries: ["cozy-lib"]
        - name: site-router-rd
          path: system/site-router-rd
          install:
            namespace: cozy-system
            releaseName: site-router-rd
