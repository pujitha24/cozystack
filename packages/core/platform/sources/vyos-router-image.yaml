---
apiVersion: cozystack.io/v1alpha1
kind: PackageSource
metadata:
  name: cozystack.vyos-router-image
spec:
  sourceRef:
    kind: OCIRepository
    name: cozystack-packages
    namespace: cozy-system
    path: /
  variants:
    - name: default
      dependsOn:
        - cozystack.networking
        # CDI imports the appliance containerDisk into the golden DataVolume.
        - cozystack.kubevirt-cdi
      components:
        - name: vyos-router-image
          path: system/vyos-router-image
          install:
            namespace: cozy-system
            releaseName: vyos-router-image
